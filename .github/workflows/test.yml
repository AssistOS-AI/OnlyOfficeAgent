name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  onlyoffice-tests:
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Check out the agent repository
        uses: actions/checkout@v4
        with:
          path: OnlyOfficeAgent
      - name: Check out the Ploinky runtime libraries
        uses: actions/checkout@v4
        with:
          repository: AssistOS-AI/ploinky
          path: ploinky
      - name: Check out AchillesAgentLib
        uses: actions/checkout@v4
        with:
          repository: AssistOS-AI/AchillesAgentLib
          path: achillesAgentLib
      - name: Provide the bundled service identities used by the runtime scripts
        run: |
          for user in postgres redis rabbitmq; do
            id -u "$user" >/dev/null 2>&1 || useradd --system --user-group --create-home --home-dir "/var/lib/$user" "$user"
          done
      - name: Run agent tests
        working-directory: OnlyOfficeAgent/onlyOffice
        env:
          PLOINKY_AGENTLIB_DIR: ${{ github.workspace }}/achillesAgentLib
        run: npm test
